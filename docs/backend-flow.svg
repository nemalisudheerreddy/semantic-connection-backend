<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Backend flow</title>
  <desc id="desc">Diagram showing FastAPI receiving a request, validating it, and sending JSON back.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="920" height="340" rx="24" fill="url(#bg)"/>
  <rect x="60" y="90" width="190" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="155" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Request</text>
  <text x="155" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">{ "name": "Sudheer" }</text>
  <rect x="355" y="70" width="210" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">FastAPI</text>
  <text x="460" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">1. Validate request body</text>
  <text x="460" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">2. Clean the name</text>
  <text x="460" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">3. Build JSON response</text>
  <text x="460" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">4. Return timestamp</text>
  <rect x="670" y="90" width="190" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="765" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Response</text>
  <text x="765" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">message</text>
  <text x="765" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">received_name</text>
  <text x="765" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">timestamp</text>
  <line x1="250" y1="165" x2="335" y2="165" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="565" y1="165" x2="650" y2="165" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
